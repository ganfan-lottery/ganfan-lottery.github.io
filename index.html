function lsGet(key, fallback) { try { const v=localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch(e) { return fallback; } }
function lsSet(key, val)    { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

function getFavs()     { return lsGet('food_favs', []); }
function setFavs(arr)  { lsSet('food_favs', arr); }
function getHist()     { return lsGet('food_hist', []); }
function setHist(arr)  { lsSet('food_hist', arr.slice(0, 50)); }
function getDislikes() { return lsGet('food_dislikes', []); }
function setDislikes(arr) { lsSet('food_dislikes', arr); }
function getRecent() { return lsGet('food_recent', []); }
function setRecent(arr) { lsSet('food_recent', arr); }
function getLocCache() { return lsGet('food_loc', null); }
function setLocCache(v){ lsSet('food_loc', v); }

function drawFood() {
  if (isDrawing) return;
  isDrawing = true;
  const btn = document.getElementById('mainDrawBtn');
  if (btn) { btn.textContent = '🎰 抽取中�?; btn.style.opacity = '0.6'; }

  // 构造可用池（过滤不喜欢的）
  const dislikes = getDislikes();
  let pool = FOOD_DB.filter(f => !dislikes.includes(f.id));
  if (currentCategory !== '全部') pool = pool.filter(f => f.cat === currentCategory);
  if (pool.length === 0) {
    pool = FOOD_DB.filter(f => !dislikes.includes(f.id));
    if (pool.length === 0) { showToast('所有美食都被你 pass 了，已重置屏蔽列�?); resetDislikesSilent(); pool = [...FOOD_DB]; }
  }

  // 防重复：记录最近抽中的菜品，降低重复率
  const recent = getRecent();
  // 优先从非最近池中抽取，最近记录至少覆盖池�?30% 但不低于 5 �?
  const recentLimit = Math.max(5, Math.floor(pool.length * 0.3));
  const recentSet = new Set(recent.slice(0, recentLimit));
  let freshPool = pool.filter(f => !recentSet.has(f.id));
  // 如果过滤后池子为空，回退到全�?
  if (freshPool.length === 0) freshPool = pool;

  const target = freshPool[Math.floor(Math.random() * freshPool.length)];

  // 记录到最近列表（保留最�?30 条）
  const newRecent = [target.id, ...recent.filter(id => id !== target.id)].slice(0, 30);
  setRecent(newRecent);

  // 快速闪烁效果（0.6秒内随机切换显示临时名称�?
  const resultNameEl = document.getElementById('resultName');
  const resultEmojiEl = document.getElementById('resultEmoji');
  const resultDetailEl = document.getElementById('resultDetail');
  const resultMetaEl = document.getElementById('resultMeta');
  const resultTagsEl = document.getElementById('resultTags');

  // 先切换到结果�?
  document.getElementById('initialState').classList.add('hidden');
  const resultState = document.getElementById('resultState');
  resultState.classList.remove('hidden');

  // 闪烁动画
  let shuffleCount = 0;
  const maxShuffles = 12;
  const shuffleInterval = setInterval(() => {
    const r = pool[Math.floor(Math.random() * pool.length)];
    resultNameEl.textContent = r.name;
    resultEmojiEl.textContent = r.emoji;
    shuffleCount++;
    if (shuffleCount >= maxShuffles) {
      clearInterval(shuffleInterval);
      // 显示最终结�?
      showResult(target);
      isDrawing = false;
      if (btn) { btn.textContent = '🎲 来一签！'; btn.style.opacity = '1'; }
    }
  }, 60);

  // 滚动到结果卡�?
  setTimeout(() => {
    resultState.scrollIntoView({ behavior:'smooth', block:'center' });
  }, 150);
}

// =====================================================
//  定位（自�?+ 缓存�?
// =====================================================
let locationResolved = false;

function autoLocation() {
  const cached = getLocCache();
  const locText = document.getElementById('locationText');

  if (cached && cached.city) {
    userLocation = cached;
    locText.textContent = '📍 ' + cached.city;
    fetchNearbyByCity(cached.city);
  }

  // 并行策略：同时尝试浏览器精确定位和IP定位，谁先完成用�?
  // 同时设置8秒兜底，避免因权限弹窗无响应而卡�?

  // 8秒兜底计时器
  setTimeout(() => {
    if (!locationResolved && (!cached || !cached.city)) {
      console.warn('定位8秒超时，强制降级');
      ipFallback();
    }
  }, 8000);

  // IP定位立即启动（无权限弹窗，通常2-3秒完成）
  if (!cached || !cached.city) {
    ipFallback();
  }

  // 浏览器精确定位作为增强（会弹权限，慢但精确）
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => {
        userLocation.lat = pos.coords.latitude;
        userLocation.lng = pos.coords.longitude;
        fetchNearby(pos.coords.latitude, pos.coords.longitude);
      },
      (err) => {
        console.warn('浏览器定位失�?', err.code, err.message);
        // 失败不影响，IP定位已经在跑或已完成
      },
      { enableHighAccuracy: false, timeout: 6000, maximumAge: 300000 }
    );
  }
}

function refreshLocation() {
  const locText = document.getElementById('locationText');
  locText.textContent = '刷新定位�?;
  locationResolved = false;
  
  // 并行策略：IP定位立即启动 + 浏览器精确定�?+ 8秒兜�?
  setTimeout(() => {
    if (!locationResolved) {
      console.warn('刷新定位超时，强制降�?);
      ipFallback();
    }
  }, 8000);

  // IP定位立即启动
  ipFallback();

  // 浏览器精确定位作为增�?
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => {
        userLocation.lat = pos.coords.latitude;
        userLocation.lng = pos.coords.longitude;
        fetchNearby(pos.coords.latitude, pos.coords.longitude);
      },
      () => {},
      { enableHighAccuracy: true, timeout: 8000 }
    );
  }
}

function ipFallback() {
  const locText = document.getElementById('locationText');
  locText.textContent = '正在通过IP定位�?;
  
  fetch(`https://restapi.amap.com/v3/ip?key=${AMAP_KEY}`)
    .then(r => r.json())
    .then(d => {
      console.log('高德IP定位返回:', d); // 调试信息
      if (d.status === '1') {
        userLocation.city = d.city || d.province || '未知';
        setLocCache({ city: userLocation.city, lat: null, lng: null });
        locationResolved = true;
        locText.textContent = '📍 ' + userLocation.city;
        fetchNearbyByCity(userLocation.city);
      } else {
        console.warn('高德IP定位失败:', d);
        locText.textContent = '定位不可�?(API错误)';
        // 备用方案：使用公共IP定位
        fallbackToPublicAPI();
      }
    })
    .catch(err => { 
      console.error('高德IP定位网络错误:', err);
      locText.textContent = '定位不可�?(网络错误)';
      fallbackToPublicAPI();
    });
}

function fallbackToPublicAPI() {
  const locText = document.getElementById('locationText');
  locText.textContent = '正在尝试备用定位�?;
  
  // 备用方案1：使用ip-api.com
  fetch('http://ip-api.com/json/?fields=status,message,city,regionName,country')
    .then(r => r.json())
    .then(data => {
      if (data.status === 'success') {
        userLocation.city = data.city || data.regionName || '未知';
        setLocCache({ city: userLocation.city, lat: null, lng: null });
        locationResolved = true;
        locText.textContent = '📍 ' + userLocation.city;
        fetchNearbyByCity(userLocation.city);
      } else {
        // 备用方案2：使用纯前端IP定位
        locText.textContent = '📍 全国';
        userLocation.city = '全国';
        setLocCache({ city: '全国', lat: null, lng: null });
      }
    })
    .catch(() => {
      // 所有方案都失败
      locText.textContent = '📍 全国 (定位失败)';
      userLocation.city = '全国';
      setLocCache({ city: '全国', lat: null, lng: null });
    });
}

function fetchNearby(lat, lng) {
  // �?页抓取，每页25条，�?00�?
  const pages = [1,2,3,4].map(page => {
    const url = `https://restapi.amap.com/v3/place/around?key=${AMAP_KEY}&location=${lng},${lat}&radius=3000&types=050000&offset=25&page=${page}&extensions=all`;
    return fetch(url).then(r=>r.json());
  });
  
  Promise.all(pages).then(results => {
    let allPois = [];
    results.forEach(data => {
      if (data.status==='1' && data.pois) {
        if (!userLocation.city) userLocation.city = data.pois[0]?.cityname || '';
        allPois = allPois.concat(data.pois);
      }
    });
    if (allPois.length) {
      setLocCache({ city: userLocation.city, lat, lng });
      locationResolved = true;
      document.getElementById('locationText').textContent = '📍 ' + userLocation.city;
      renderNearby(allPois);
    }
  }).catch(() => {});
}

function fetchNearbyByCity(city) {
  const pages = [1,2,3,4].map(page => {
    const url = `https://restapi.amap.com/v3/place/text?key=${AMAP_KEY}&keywords=餐饮&city=${encodeURIComponent(city)}&offset=25&page=${page}&extensions=all`;
    return fetch(url).then(r=>r.json());
  });

  Promise.all(pages).then(results => {
    let allPois = [];
    results.forEach(data => {
      if (data.status==='1' && data.pois) allPois = allPois.concat(data.pois);
    });
    if (allPois.length) renderNearby(allPois);
  }).catch(()=>{});
}

function renderNearby(pois) {
  const section = document.getElementById('nearbySection');
  const list = document.getElementById('nearbyList');
  document.getElementById('nearbyCity').textContent = userLocation.city || '';

  if (!pois || !pois.length) { section.classList.add('hidden'); return; }
  section.classList.remove('hidden');

  list.innerHTML = pois.map(p => {
    const dist = p.distance
      ? (p.distance < 1000 ? `${p.distance}m` : `${(p.distance/1000).toFixed(1)}km`)
      : '';
    const cat = (p.type||'').split(';').filter(t => t.indexOf('餐饮')===-1)[0] || '美食';
    const catClean = cat.replace(/中餐厅|外国餐厅|快餐厅|休闲餐饮|地方风味|冷饮店|咖啡厅|茶艺馆|糕饼�?g, '').replace(/[;�?]/g,'').trim() || '美食';
    const rating = p.biz_ext?.rating || '';
    const cost   = p.biz_ext?.cost || '';
    const addr   = p.address || '';
    const photos = (p.photos||[]).slice(0,1);
    const photoUrl = photos.length ? `https://${photos[0].url.replace('http://','').replace('https://','')}` : '';
    const tag = p.tag || '';

    // 模拟推荐菜品（基于品类）
    const cuisineMap = {
      '火锅': '毛肚·鹅肠·肥牛', '烧烤': '羊肉串·烤生蚝·鸡翅',
      '川菜': '水煮鱼·回锅肉·宫保鸡丁', '粤菜': '白切鸡·煲仔饭·虾饺',
      '湘菜': '剁椒鱼头·小炒�?, '日料': '三文鱼·寿司·天妇罗',
      '韩餐': '烤肉·石锅拌饭·炸鸡', '西餐': '牛排·意面·披萨',
      '小吃': '臭豆腐·煎饼·烤冷面', '面馆': '牛肉面·炸酱面·刀削面',
      '快餐': '汉堡·薯条·炸鸡', '甜品': '蛋糕·冰淇淋·双皮奶',
      '饮品': '珍珠奶茶·水果茶·咖�?, '海鲜': '大闸蟹·小龙虾·扇贝',
      '东北�?: '锅包肉·地三鲜·猪肉炖粉�?,
      '西北�?: '羊肉泡馍·大盘鸡·烤羊腿',
    };
    let recommend = tag || '';
    for (const [k,v] of Object.entries(cuisineMap)) {
      if (catClean.includes(k) || (p.name||'').includes(k)) { recommend = v; break; }
    }
    if (!recommend) recommend = '招牌菜·人气单�?;

    return `
      <div class="flex items-start gap-3 py-3 border-b border-gray-50 last:border-0">
        ${photoUrl ? `<img src="${photoUrl}" class="w-16 h-16 rounded-lg object-cover flex-shrink-0" onerror="this.style.display='none'">` : ''}
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2">
            <span class="font-semibold text-sm text-gray-800 truncate">${p.name}</span>
            ${rating ? `<span class="text-xs font-bold text-warm-500 bg-warm-50 px-1.5 py-0.5 rounded">${rating}</span>` : ''}
          </div>
          <div class="flex items-center gap-1.5 mt-1 text-xs text-gray-400">
            <span class="bg-gray-100 px-1.5 py-0.5 rounded">${catClean}</span>
            ${dist ? `<span>${dist}</span>` : ''}
            ${cost ? `<span>·</span><span>人均${cost}</span>` : ''}
          </div>
          <div class="text-xs text-gray-500 mt-1 truncate">
            <span class="text-orange-400">推荐�?/span>${recommend}
          </div>
          ${addr ? `<div class="text-[11px] text-gray-300 mt-0.5 truncate">${addr}</div>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 1800);
}
